name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  web:
    name: Lint & build (Next.js)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  python:
    name: Compile check (agent pipeline)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - run: pip install -r requirements.txt
      - run: python -m py_compile $(git ls-files '*.py')
      - name: Run geometry pipeline against the synthetic fixture
        run: |
          python agent_b/fixtures/generate_sample_dxf.py
          python agent_b/dwg_parser.py
          python agent_b/3d_room_builder.py
